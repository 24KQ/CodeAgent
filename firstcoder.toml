# FirstCoder 项目级配置：使用 Vote520 的 OpenAI 兼容接口。
# API Key 放在 .env 文件的 VOTE520_API_KEY 里（.env 已被 gitignore）。
default_model = "vote520/gpt-5.6-luna"

[providers.vote520]
type = "openai-compatible"
base_url = "https://ai.vote520.com/v1"
api_key_env = "VOTE520_API_KEY"

[models."vote520/gpt-5.6-luna"]
label = "GPT 5.6 Luna"
context_window = 128000

[models."vote520/gpt-5.6-luna".request]
temperature = 0.0
reasoning_effort = "xhigh"

[permissions]
mode = "ask"
